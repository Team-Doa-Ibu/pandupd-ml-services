---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
    - repo: local
      hooks:

          - id: black
            name: Format with Black
            entry: uv run black
            language: system
            types: [python]

          - id: ruff
            name: Check with Ruff
            entry: uv run ruff
            language: system
            pass_filenames: false
            always_run: true
            args: ["check", "diagnosis_service", "tests", "--fix"]

          - id: mypy
            name: Validate types with MyPy
            entry: uv run mypy
            language: system
            types: [python]
            pass_filenames: false
            args:
              - "diagnosis_service"